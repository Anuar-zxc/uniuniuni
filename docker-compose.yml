services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: offerready
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offerready}
      POSTGRES_DB: offerready
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerready"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-offerready}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-offerready-secret}
    volumes: [miniodata:/data]
    ports: ["9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-offerready} $${S3_SECRET_KEY:-offerready-secret}
      && mc mb --ignore-existing local/offerready"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://offerready:${POSTGRES_PASSWORD:-offerready}@postgres:5432/offerready
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-offerready}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-offerready-secret}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://backend:8000" }
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
