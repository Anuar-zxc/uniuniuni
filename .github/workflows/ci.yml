name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: offerready
          POSTGRES_PASSWORD: offerready
          POSTGRES_DB: offerready
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U offerready" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github app tests
      - name: Tests (SQLite, mock AI provider)
        if: always()
        run: |
          set +e
          pytest -x -q -p no:cacheprovider > pytest.out 2>&1
          status=$?
          cat pytest.out
          if [ $status -ne 0 ]; then
            python -c "import sys,urllib.parse as u; t=open('pytest.out').read()[-6000:]; print('::error title=pytest::' + t.replace('%','%25').replace('\r','').replace('\n','%0A'))"
          fi
          exit $status
      - name: Smoke test against Postgres
        if: always()
        env:
          DATABASE_URL: postgresql+psycopg://offerready:offerready@localhost:5432/offerready
          AI_PROVIDER: mock
          ENVIRONMENT: development
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              assert c.get('/api/health').json()['status'] == 'ok'
              r = c.post('/api/v1/auth/register', json={'email': 'pg@example.com', 'password': 'password123'})
              assert r.status_code == 201, r.text
              h = {'Authorization': 'Bearer ' + r.json()['access_token']}
              cv = open('tests/conftest.py').read().split('CV = \"\"\"')[1].split('\"\"\"')[0]
              assert c.post('/api/v1/resumes/text', headers=h, json={'text': cv}).status_code == 201
              assert c.get('/api/v1/dashboard', headers=h).status_code == 200
          print('postgres smoke ok')
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build (includes type check)
        run: |
          set +e
          npm run build > build.out 2>&1
          status=$?
          cat build.out
          if [ $status -ne 0 ]; then
            node -e "const t=require('fs').readFileSync('build.out','utf8').slice(-6000);console.log('::error title=next build::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
          fi
          exit $status
      - name: Lint
        if: always()
        run: |
          set +e
          npx next lint --format compact > lint.out 2>&1
          status=$?
          cat lint.out
          if [ $status -ne 0 ]; then
            node -e "const t=require('fs').readFileSync('lint.out','utf8').slice(-6000);console.log('::error title=eslint::'+t.replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
          fi
          exit $status
