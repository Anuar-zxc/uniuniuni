[project]
name = "offerready-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "redis>=5.0",
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
